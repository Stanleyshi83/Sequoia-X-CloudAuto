name: 每日自动选股
on:
  schedule:
    # 北京时间 交易日15:45 = UTC时间 07:45
    - cron: '45 7 * * 1-5'
  workflow_dispatch:
jobs:
  run-sequoia:
    runs-on: ubuntu-24.04
    env:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_SUMMARY_WEBHOOK: ${{ secrets.FEISHU_SUMMARY_WEBHOOK }}
      FEISHU_WEBHOOK_TURTLE_TRADE: ${{ secrets.FEISHU_WEBHOOK_TURTLE_TRADE }}
      FEISHU_WEBHOOK_MA_VOLUME: ${{ secrets.FEISHU_WEBHOOK_MA_VOLUME }}
    steps:
      # 保留 lfs: true：下载仓库里的兜底db
      - name: 拉取完整项目代码
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 配置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装所有第三方依赖
        run: |
          pip install baostock pandas numpy requests python-dotenv pydantic-settings rich tqdm tenacity

      # 加载缓存：key每次唯一，确保增量写回
      - name: 加载数据库缓存
        uses: actions/cache@v4
        with:
          path: data
          key: sequoia-db-${{ github.run_id }}
          restore-keys: |
            sequoia-db-

      # 兜底判断：仓库db + 缓存db 都没有时才回填（几乎不会发生）
      - name: 数据回填（仅极端兜底）
        run: |
          if [ ! -f "data/sequoia_v2.db" ]; then
            echo "仓库db和缓存均无，执行全量backfill（极端情况）"
            python main.py --backfill
          else
            echo "数据库已就绪（缓存或仓库），跳过回填，直接增量同步快照"
          fi

      - name: 运行选股主程序
        run: python main.py

      - name: 上传东方财富导入文件
        if: success() && hashFiles('eastmoney_import.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: 东方财富重合股票导入文件
          path: eastmoney_import.txt
