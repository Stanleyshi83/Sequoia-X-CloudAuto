name: 每日自动选股

on:
  schedule:
    # 北京时间 交易日15:45 = UTC时间 07:45
    - cron: '45 7 * * 1-5'
  workflow_dispatch:

jobs:
  run-sequoia:
    runs-on: ubuntu-24.04
    # ========== 全局环境变量：本job下面所有步骤全部共享 ==========
    env:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_SUMMARY_WEBHOOK: ${{ secrets.FEISHU_SUMMARY_WEBHOOK }}
      FEISHU_WEBHOOK_TURTLE_TRADE: ${{ secrets.FEISHU_WEBHOOK_TURTLE_TRADE }}
      FEISHU_WEBHOOK_MA_VOLUME: ${{ secrets.FEISHU_WEBHOOK_MA_VOLUME }}
    steps:
      - name: 拉取完整项目代码
        uses: actions/checkout@v4

      - name: 配置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装所有第三方依赖
        run: |
          pip install baostock pandas numpy requests python-dotenv pydantic-settings rich tqdm tenacity

      # 加载缓存：缓存data目录（sqlite数据库）
      - name: 加载数据库缓存
        uses: actions/cache@v4
        with:
          path: data
          key: sequoia-db-v1

      # 判断缓存是否存在，不存在就执行全量backfill；存在则跳过回填
      - name: 数据回填（仅首次/缓存失效时执行）
        run: |
          if [ ! -f "data/sequoia_v2.db" ]; then
            echo "数据库不存在，执行全量backfill"
            python main.py --backfill
          else
            echo "数据库已存在，跳过全量回填，直接增量同步快照"
          fi

      - name: 运行选股主程序
        run: python main.py

      - name: 上传东方财富导入文件
        if: success() && hashFiles('eastmoney_import.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: 东方财富重合股票导入文件
          path: eastmoney_import.txt
