name: 每日自动选股

on:
  schedule:
    # 北京时间 交易日15:45 = UTC时间 07:45
    - cron: '45 7 * * 1-5'
  workflow_dispatch:

jobs:
  run-sequoia:
    runs-on: ubuntu-24.04
    steps:
      - name: 拉取完整项目代码
        uses: actions/checkout@v4

      - name: 配置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装所有第三方依赖
        run: |
          pip install baostock pandas numpy requests python-dotenv pydantic-settings rich tqdm tenacity

      - name: 运行选股主程序
        env:
          # 汇总推送用webhook
          FEISHU_SUMMARY_WEBHOOK: ${{ secrets.FEISHU_SUMMARY_WEBHOOK }}
          # 下面按你本地.env里的变量名，逐个添加对应的Secret
          # FEISHU_WEBHOOK_TURTLE_TRADE: ${{ secrets.FEISHU_WEBHOOK_TURTLE_TRADE }}
          # FEISHU_WEBHOOK_MA_VOLUME: ${{ secrets.FEISHU_WEBHOOK_MA_VOLUME }}
        run: python main.py

      - name: 上传东方财富导入文件
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 东方财富重合股票导入文件
          path: eastmoney_import.txt
